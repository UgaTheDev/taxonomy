version: 3\ndomain: cooking\ntask_description: This contribution provides detailed knowledge on troubleshooting\n  common issues in sourdough fermentation, focusing on the impact of temperature and\n  time, identifying signs of over- and under-fermentation, understanding starter activity,\n  correcting acidity imbalances, and the importance of ambient environment and desired\n  dough temperature.\ncreated_by: UgaTheDev\nseed_examples:\n- question: What are common issues in sourdough fermentation related to temperature\n    and time?\n  answer: The most frequent issue is temperature-driven timing. Warmth accelerates\n    yeast activity, while cold slows it. If the temperature is too high (above 30°C),\n    the dough can turn into a sticky, acidic mess before it gains structure. If it\\\'s\n    too cold, fermentation stalls, leading to a dense, heavy loaf.\n- question: How does over-fermentation manifest in sourdough dough and what causes\n    it?\n  answer: \'Signs: The dough becomes extremely sticky, loses its ability to hold shape\n    (pancaking), and the gluten structure literally dissolves. The baked loaf will\n    have a pale crust and a flat, tight crumb.\\n\\nCause: This happens when the bacteria\n    produce too much acid, which breaks down the gluten network, or when the yeast\n    exhausts its food supply.\'\n- question: What are the signs of under-fermentation in sourdough and what is the\n    underlying reason?\n  answer: \'Signs: The dough feels heavy and \"dead.\" After baking, you’ll see \"tunneling\"\n    (huge holes surrounded by dense, gummy dough).\\n\\nReason: The yeast hasn’t produced\n    enough CO2​ to expand the gluten network. This usually stems from a cold environment\n    or rushing the \"bulk fermentation\" stage.\'\n- question: How does the activity of the sourdough starter impact the consistency\n    of the final dough?\n  answer: A weak starter results in a sluggish rise and a dough that feels \"slack\"\n    because the fermentation hasn\\\'t created the internal tension needed for strength.\
    \ Conversely, a vigorous starter creates a bouncy, aerated dough that is much easier\n    to shape and handle.\n- question: What does an expert observe in a sourdough starter to ensure its peak\n    activity?\n  answer: \'An expert looks for:\\n\\nVolume: The starter has at least doubled or tripled\n    in size.\\n\\nSurface: Small bubbles on top and a \"domed\" surface (not sunken).\\n\\nTexture:\n    A bubbly, mousse-like consistency throughout.\\n\\nAroma: A pleasant, fruity, or\n    boozy tang, rather than a harsh vinegar or acetone smell.\'\n- question: How can an acidity imbalance in a sourdough starter be corrected?\n  answer: If a starter is too acidic (smells like vinegar or paint thinner), it can\n    be corrected by increasing the feeding ratio. Instead of a 1:1:1 (starter:flour:water)\n    ratio, try 1:5:5. This \"dilutes\" the acid and gives the yeast fresh food to outpace\n    the acid-producing bacteria.\n- question: Why is the ambient environment crucial for sourdough fermentation, and\n    how does temperature fluctuation affect it?\n  answer: The environment acts as the \"thermostat\" for your bread. Temperature fluctuations—like\n    a kitchen cooling down 10°C overnight—make fermentation unpredictable. Consistent\n    ambient heat ensures that the yeast and bacteria grow at a synchronized rate,\n    allowing you to follow a schedule.\n- question: What is \"Fools Crumb\" in sourdough, and how can it be prevented?\n  answer: \'\"Fools Crumb\" describes a loaf that looks airy at first glance but is actually\n    under-fermented. It features large, uneven holes at the top and dense dough at\n    the bottom.\\n\\nPrevention: Ensure your bulk fermentation lasts long enough and\n    that your starter is truly active before mixing.\'\n- question: What is the \"Desired Dough Temperature\" (DDT) for predictable sourdough\n    results?\n  answer: For most sourdough recipes, the DDT is 24°C to 26°C (75°F to 78°F). This\n    range is the \"sweet spot\" where yeast and lactic acid bacteria (LAB) work in harmony\n    to produce the best flavor and structure.\n